name: Candle2 Linux64

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_linux:

    runs-on: ubuntu-22.04

    env:
      SOURCE_DIR:   ${{ github.workspace }}
      QT_VERSION:   5.15.2
      ARTIFACT:     Candle2_AppImage

    defaults:
      run:
        shell: bash

    steps:
      - name: Install QT
        run: |
          sudo apt install qt5-qmake qtbase5-dev-tools libqt5serialport5-dev libfuse2 -y

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir build && cd build
          qmake ../src/candle2.pro
          cd ..

      - name: Build
        run: |
          cd build
          make -j6
          cd ..

      - name: Deploy
        run: |
          mkdir -p AppDir/usr/bin
          mkdir deploy && cd deploy
          wget "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x *.AppImage
          cp ../bin/Candle2 ../AppDir/usr/bin
          ./linuxdeployqt-continuous-x86_64.AppImage ../AppDir/usr/share/applications/Candle2.desktop -verbose=2
          ./linuxdeployqt-continuous-x86_64.AppImage ../AppDir/usr/share/applications/Candle2.desktop -verbose=2 -appimage
          cd ..


      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            deploy/Candle2*.AppImage

  build_win:
    runs-on:  windows-2022

    env:
      SOURCE_DIR:   ${{ github.workspace }}
      QT_VERSION:   5.15.2
      ARTIFACT:     candle2-win.zip

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         windows
          target:       desktop
          arch:         win64_msvc2019_64
          dir:          ${{ runner.temp }}
          setup-python: false

      - name: Download JOM
        uses: suisei-cn/actions-download-file@master
        with:
          url:    http://download.qt.io/official_releases/jom/jom.zip
          target: ${{ runner.temp }}\

      - name: Unzip JOM
        working-directory: ${{ runner.temp }}
        run:  |
              7z x jom.zip -ojom

      - name: Create build directory
        run:  mkdir ${{ runner.temp }}\build

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build
        working-directory: ${{ runner.temp }}\build
        run:  |
              qmake -r ${{ env.SOURCE_DIR }}\src\candle2.pro
              ${{ runner.temp }}\jom\jom -j3
              cd release
              windeployqt --qmldir ${{ env.SOURCE_DIR }} Candle2.exe --pdb --release --compiler-runtime
              copy C:\Windows\System32\concrt140.dll .
              copy C:\Windows\System32\vccorlib140.dll .
              copy C:\Windows\System32\msvcp140.dll .
              copy C:\Windows\System32\vcruntime140.dll .

      - name: Zip build
        working-directory: ${{ runner.temp }}
        run:  |
              7z a candle2-win.zip ${{ runner.temp }}\build\* -r -x!*.h -x!*.obj -x!*.cpp -x!*.rc -x!*.stash -x!*.Debug -x!*.Release -x!Makefile

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}\${{ env.ARTIFACT }}

  build_macos:
    # Builds an arm64-only .app bundle on Apple Silicon. Intel Mac users need
    # to build from source — Candle2's pre-existing CI didn't ship macOS at all,
    # so any automated build is progress. A universal-binary step can be added
    # later without restructuring the job.
    runs-on: macos-latest

    env:
      SOURCE_DIR: ${{ github.workspace }}
      ARTIFACT:   candle2-macos.zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Qt6
        # Homebrew's `qt` formula is Qt 6.x. `qtserialport` is a separate Qt6
        # module (unlike Qt5 where it was part of qt-everywhere). Both are
        # needed to build Candle2 on macOS.
        run: |
          brew install qt qtserialport

      - name: Configure
        run: |
          mkdir build && cd build
          qmake6 ../src/candle2.pro

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Bundle Qt frameworks
        # macdeployqt rewrites the .app's rpaths and copies all required Qt
        # frameworks + plugins into Candle2.app/Contents/Frameworks so the
        # bundle is self-contained. Without this, the app only runs on
        # machines that already have Homebrew Qt installed.
        run: |
          cd bin
          "$(brew --prefix qt)/bin/macdeployqt" Candle2.app -verbose=1

      - name: Zip .app
        # Use `ditto -k` instead of `zip` so macOS extended attributes
        # (including the ad-hoc code signature macdeployqt applies) survive
        # the round-trip through the Actions artifact store.
        run: |
          cd bin
          ditto -c -k --sequesterRsrc --keepParent Candle2.app "${{ env.ARTIFACT }}"

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: build/${{ env.ARTIFACT }}

  release:
    needs: [build_linux, build_win, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: List files
        run: ls -R ./
        shell: bash

      - name: Update Current Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Release $$"
          draft: false
          prerelease: true
          body: |
            This is the latest binary release.

          files: |
            Candle2_AppImage/Candle2*.AppImage
            candle2-win.zip/candle2-win.zip
            candle2-macos.zip/candle2-macos.zip
